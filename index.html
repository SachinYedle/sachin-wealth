    function formatINR(val) {
      const n = Math.round(Number(val) || 0);
      return (n < 0 ? '-₹' : '₹') + Math.abs(n).toLocaleString('en-IN');
    }

    // Check incoming ?sms= parameter from iPhone Shortcuts
    window.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const sms = params.get('sms');
      if (sms) {
        activeTab = 'expenses';
        entryMode = 'sms';
        setTimeout(() => {
          const box = document.getElementById('smsBox');
          if (box) { box.value = decodeURIComponent(sms); parseSmsText(box.value); }
        }, 150);
      }
    });

    window.parseSmsText = function(raw) {
      if (!raw) return;
      const amtMatch = raw.match(/(?:Rs\.?|INR|₹)\s*([0-9,]+(?:\.\d{1,2})?)/i);
      if (amtMatch && amtMatch[1]) {
        document.getElementById('txAmt').value = amtMatch[1].replace(/,/g, '');
      }
      const lower = raw.toLowerCase();
      const accEl = document.getElementById('txAcc');
      const catEl = document.getElementById('txCat');
      const subEl = document.getElementById('txSub');
      const noteEl = document.getElementById('txNote');

      if (lower.includes('rupay') || lower.includes('credit card') || lower.includes('cc')) accEl.value = 'RuPay CC';
      else if (lower.includes('sodexo') || lower.includes('pluxee')) accEl.value = 'Sodexo';
      else accEl.value = 'Bank UPI';

      if (lower.includes('petrol') || lower.includes('hpcl') || lower.includes('diesel') || lower.includes('fuel')) {
        catEl.value = '3XO & Transport'; updateSubcats('3XO & Transport'); subEl.value = '3XO Diesel'; noteEl.value = '3XO Fuel / Diesel';
      } else if (lower.includes('hospital') || lower.includes('scan') || lower.includes('pharma') || lower.includes('apollo')) {
        catEl.value = 'Hospital & Medical'; updateSubcats('Hospital & Medical'); subEl.value = 'Prenatal & Pregnancy'; noteEl.value = 'Hospital / Pharmacy';
      } else if (lower.includes('swiggy') || lower.includes('zomato') || lower.includes('chicken') || lower.includes('party')) {
        catEl.value = 'Food & Groceries'; updateSubcats('Food & Groceries'); subEl.value = 'Party'; noteEl.value = 'Party / Food Order';

    window.updateSubcats = function(catName) {

      }
    };

    window.addTx = function() {
      const amt = Number(document.getElementById('txAmt').value);
      if (!amt || amt <= 0) return;
      const type = document.getElementById('txType').value;
      const acc = document.getElementById('txAcc').value;
      const cat = document.getElementById('txCat').value;
      const sub = document.getElementById('txSub').value;
      const note = document.getElementById('txNote').value.trim() || sub;
      const date = document.getElementById('txDate').value || new Date().toISOString().slice(0,10);

      state.transactions.unshift({
        id: 'tx_' + Date.now(),
        date, type, amount: amt, category: cat, subcategory: sub, merchant: note, account: acc
      });

      if (type === 'Expense') {
        if (acc === 'Bank UPI' || acc === 'Bank Transfer') state.liveBankBalance = Math.max(0, state.liveBankBalance - amt);
        else if (acc === 'RuPay CC') state.rupayCcBalance += amt;
      } else {
        state.liveBankBalance += amt;
      }
      save();
    };

    window.deleteTx = function(id) {
      state.transactions = state.transactions.filter(t => t.id !== id);
      save();
    };

    window.payRupay = function() {
      if (state.rupayCcBalance <= 0) return;
      const due = state.rupayCcBalance;
      state.liveBankBalance = Math.max(0, state.liveBankBalance - due);
      state.rupayCcBalance = 0;
      state.transactions.unshift({
        id: 'tx_' + Date.now(),
        date: new Date().toISOString().slice(0,10),
        type: 'Expense',
        amount: due,
        category: 'Debt, CC & Insurance',

    };

      const type = document.getElementById('lentType_' + personId).value;
      const note = document.getElementById('lentNote_' + personId).value.trim() || (type === 'lent' ? 'Lent More' : 'Returned');
      const date = document.getElementById('lentDate_' + personId).value || new Date().toISOString().slice(0,10);

      state.moneyLent = state.moneyLent.map(p => {
        if (p.id !== personId) return p;
        const nextH = [{ id: 'h_' + Date.now(), date, type, amount: amt, note }, ...(p.history || [])];
        const nextTotal = nextH.reduce((s, h) => s + (h.type === 'returned' ? -Number(h.amount) : Number(h.amount)), 0);
        return { ...p, history: nextH, amount: Math.max(0, nextTotal) };
      });
      save();
    };

      if (!inp || !inp.value.trim()) return;
      state.categoryTree = state.categoryTree.map(c => c.id === catId ? { ...c, subcategories: [...c.subcategories, inp.value.trim()] } : c);
      save();
    };

    window.removeSubcat = function(catId, idx) {
      state.categoryTree = state.categoryTree.map(c => c.id === catId ? { ...c, subcategories: c.subcategories.filter((_, i) => i !== idx) } : c);
      save();
    };

    function render() {
      const isDark = state.uiTheme === 'dark';
      const body = document.getElementById('bodyRoot');
      body.className = isDark
        ? 'bg-[#090D16] text-slate-100 safe-bottom transition-colors duration-200'
        : 'bg-[#F4F1EA] text-zinc-900 safe-bottom transition-colors duration-200';

      const cardCls = isDark ? 'bg-[#111726] border-slate-800 text-slate-100' : 'bg-white border-[#E5E0D5] text-zinc-900 shadow-sm';
      const subCardCls = isDark ? 'bg-[#0B0F19] border-slate-800' : 'bg-[#F7F5EF] border-[#E5E0D5]';
      const mutedTxt = isDark ? 'text-slate-400' : 'text-zinc-500';
      const accentTxt = isDark ? 'text-indigo-400' : 'text-indigo-800';

      // Calculate dynamic totals for selected month in Time-Machine
      const selTimeline = TIMELINE[selectedMonthIdx] || TIMELINE[0];
      const mAhead = selTimeline.m;
      let nps = 676120, pf = 625213, ppf = 118178;
      for (let i = 0; i < mAhead; i++) {
        nps = nps * (1 + 0.10/12) + 20497;
        pf = pf * (1 + 0.0825/12) + 4720;
        ppf = ppf * (1 + 0.071/12) + 1000;
      }
      const retireSum = Math.round(nps + pf + ppf);
      const mfStSum = state.assetGroups.slice(1).reduce((s, g) => s + g.items.reduce((a, i) => a + Number(i.amount||0), 0), 0);
      const lentSum = state.moneyLent.reduce((s, p) => s + Number(p.amount||0), 0);
      const totalAssets = retireSum + mfStSum + lentSum + state.liveBankBalance;

      const rRow = state.roadmap[Math.min(mAhead, state.roadmap.length - 1)] || state.roadmap[0];
      let carBal = 1100000;
      for (let i = 0; i < mAhead; i++) {
        const intr = carBal * (0.09/12);
        carBal = Math.max(0, carBal - (20800 - intr));
      }
      const totalDebt = mAhead === 0
        ? (1800000 + 1425000 + 1100000 + state.rupayCcBalance)
        : Math.round(rRow.bobBal + rRow.friendBal + carBal);
      const netWorth = totalAssets - totalDebt;
      const novSpends = state.transactions.filter(t => t.type === 'Expense').reduce((s, t) => s + Number(t.amount||0), 0);

      let mainHtml = '';

      if (activeTab === 'expenses') {
        const defaultCat = state.categoryTree[0];
        mainHtml = `
          <div class="rounded-3xl p-4 border ${cardCls} space-y-3">
            <div class="grid grid-cols-2 gap-1.5 p-1 rounded-2xl border ${subCardCls}">
              <button onclick="entryMode='manual';render();" class="py-2 rounded-xl text-xs font-bold ${entryMode==='manual'?'btn-primary-uniform':'text-zinc-500'}">+ Manual Entry</button>
              <button onclick="entryMode='sms';render();" class="py-2 rounded-xl text-xs font-bold ${entryMode==='sms'?'btn-primary-uniform':'text-zinc-500'}">✨ Auto SMS Reader</button>
            </div>
            ${entryMode === 'sms' ? `
              <div class="p-3 rounded-2xl border ${subCardCls} space-y-2">
                <p class="text-[11px] font-bold ${accentTxt}">Paste Bank / RuPay CC SMS (Auto-Fills Below)</p>
                <textarea id="smsBox" rows="2" oninput="parseSmsText(this.value)" placeholder="Paste Axis Bank, RuPay CC, or UPI SMS here..." class="w-full rounded-xl p-2 text-xs border ${cardCls}"></textarea>
              </div>
            ` : ''}
            <div class="grid grid-cols-3 gap-2">
              <select id="txType" class="rounded-xl px-2 py-2 text-xs font-bold border ${subCardCls}">
                <option value="Expense">Expense (-)</option>
                <option value="Income">Income (+)</option>
              </select>
              <input id="txAmt" type="number" placeholder="₹ Amount" class="rounded-xl px-3 py-2 text-xs font-bold border ${subCardCls}" />
              <select id="txAcc" class="rounded-xl px-2 py-2 text-xs font-medium border ${subCardCls}">
                <option value="Bank UPI">Bank UPI</option>
                <option value="RuPay CC">RuPay CC</option>
                <option value="Sodexo">Sodexo</option>
                <option value="Bank Transfer">Bank Transfer</option>
              </select>
            </div>
            <div class="grid grid-cols-2 gap-2">
              <select id="txCat" onchange="updateSubcats(this.value)" class="rounded-xl px-2.5 py-2 text-xs border ${subCardCls}">
                ${state.categoryTree.map(c => `<option value="${c.name}">${c.emoji} ${c.name}</option>`).join('')}
              </select>
              <select id="txSub" class="rounded-xl px-2.5 py-2 text-xs font-bold ${accentTxt} border ${subCardCls}">
                ${defaultCat.subcategories.map(s => `<option value="${s}">${s}</option>`).join('')}
              </select>
            </div>
            <div class="grid grid-cols-3 gap-2">
              <input id="txNote" type="text" placeholder="Note / Item (e.g. Party, Diesel)" class="col-span-2 rounded-xl px-3 py-2 text-xs border ${subCardCls}" />
              <input id="txDate" type="date" value="${new Date().toISOString().slice(0,10)}" class="rounded-xl px-2 py-2 text-xs border ${subCardCls}" />
            </div>
            <button onclick="addTx()" class="w-full py-2.5 rounded-xl font-bold text-xs btn-primary-uniform">+ Save Expense to Daily Ledger</button>
          </div>

          <div class="rounded-3xl p-4 border ${cardCls} space-y-2.5">
            <div class="flex justify-between items-center">
              <h3 class="text-xs font-bold">Daily Expense Ledger (${state.transactions.length})</h3>
              <span class="text-xs font-bold text-rose-600">Total: ${formatINR(novSpends)}</span>
            </div>
            <div class="divide-y divide-stone-200/40 space-y-1">
              ${state.transactions.map(t => `
                <div class="pt-2 flex items-center justify-between text-xs">
                  <div>
                    <p class="font-bold">${t.merchant}</p>
                    <p class="text-[10px] ${mutedTxt}">${t.date} • <span class="${accentTxt} font-semibold">${t.subcategory}</span> • ${t.account}</p>
                  </div>
                  <div class="flex items-center gap-2">
                    <span class="font-extrabold ${t.type==='Expense'?'text-rose-600':accentTxt}">${t.type==='Expense'?'-':'+'}${formatINR(t.amount)}</span>
                    <button onclick="deleteTx('${t.id}')" class="text-zinc-400 hover:text-rose-500 text-xs px-1">✕</button>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      } else if (activeTab === 'categories') {
        mainHtml = `
          <div class="space-y-3">
            ${state.categoryTree.map(cat => `
              <div class="rounded-3xl p-4 border ${cardCls} space-y-2.5">
                <div class="flex justify-between items-center">
                  <span class="text-xs font-extrabold">${cat.emoji} ${cat.name}</span>
                  <span class="text-[10px] ${mutedTxt}">Budget: ${formatINR(cat.monthlyBudget)}</span>
                </div>
                <div class="flex flex-wrap gap-1.5">
                  ${cat.subcategories.map((s, idx) => `
                    <span class="px-2.5 py-1 rounded-xl text-xs border ${subCardCls} flex items-center gap-1.5">
                      <span>${s}</span>
                      <button onclick="removeSubcat('${cat.id}', ${idx})" class="text-zinc-400 hover:text-rose-500">✕</button>
                    </span>
                  `).join('')}
                </div>
                <div class="flex gap-2 pt-1">
                  <input id="subInp_${cat.id}" type="text" placeholder="+ Add subcategory..." class="flex-1 rounded-xl px-3 py-1.5 text-xs border ${subCardCls}" />
                  <button onclick="addSubcat('${cat.id}')" class="px-3 py-1.5 rounded-xl text-xs font-bold btn-primary-uniform">+ Add</button>
                </div>
              </div>
            `).join('')}
          </div>
        `;
      } else if (activeTab === 'balancesheet') {
        mainHtml = `
          <div class="rounded-3xl p-3.5 border ${cardCls} space-y-2.5">
            <p class="text-xs font-bold">Balance Sheet Time-Machine (2026 → 2028)</p>
            <div class="flex gap-1.5 overflow-x-auto pb-1 no-scrollbar">
              ${TIMELINE.map((t, idx) => `
                <button onclick="selectedMonthIdx=${idx};render();" class="shrink-0 px-3 py-1.5 rounded-xl text-[11px] font-bold ${selectedMonthIdx===idx?'btn-primary-uniform':subCardCls}">${t.label}</button>
              `).join('')}
            </div>
            <p class="text-[11px] ${accentTxt} font-bold">${selTimeline.desc}</p>
          </div>

          <div class="rounded-3xl p-4 border ${cardCls} space-y-3">
            <span class="text-[10px] font-bold uppercase px-2.5 py-0.5 rounded-full bg-indigo-500/10 ${accentTxt}">Net Worth • ${selTimeline.label}</span>
            <h2 class="text-2xl font-black">${formatINR(netWorth)}</h2>
            <div class="grid grid-cols-2 gap-2 text-xs">
              <div class="p-3 rounded-2xl border ${subCardCls}">
                <p class="text-[10px] ${mutedTxt}">Retirement (NPS+PF+PPF)</p>
                <p class="font-extrabold ${accentTxt} mt-0.5">${formatINR(retireSum)}</p>
              </div>
              <div class="p-3 rounded-2xl border ${subCardCls}">
                <p class="text-[10px] ${mutedTxt}">MF + Shares</p>
                <p class="font-extrabold ${accentTxt} mt-0.5">${formatINR(mfStSum)}</p>
              </div>
              <div class="p-3 rounded-2xl border ${subCardCls}">
                <p class="text-[10px] ${mutedTxt}">Money Lent (${state.moneyLent.length})</p>
                <p class="font-extrabold ${accentTxt} mt-0.5">${formatINR(lentSum)}</p>
              </div>
              <div class="p-3 rounded-2xl border ${subCardCls}">
                <p class="text-[10px] ${mutedTxt}">Remaining Debt</p>
                <p class="font-extrabold text-rose-600 mt-0.5">${formatINR(totalDebt)}</p>
              </div>
            </div>
          </div>

          <div class="rounded-3xl p-4 border ${cardCls} space-y-2.5">
            <h3 class="text-xs font-extrabold">Money Lent Dated Ledger (${formatINR(lentSum)})</h3>
            <div class="space-y-2">
              ${state.moneyLent.map(p => `
                <div class="rounded-2xl border ${subCardCls} overflow-hidden">
                  <button onclick="expandedLentId = (expandedLentId==='${p.id}'?null:'${p.id}');render();" class="w-full p-3 flex justify-between items-center text-left">
                    <div>
                      <p class="text-xs font-bold">${p.name}</p>
                      <p class="text-[10px] ${mutedTxt}">${p.note}</p>
                    </div>
                    <span class="text-xs font-extrabold ${accentTxt}">${formatINR(p.amount)} ▾</span>
                  </button>
                  ${expandedLentId === p.id ? `
                    <div class="p-3 border-t border-stone-200/40 space-y-2">
                      <div class="grid grid-cols-3 gap-1.5">
                        <select id="lentType_${p.id}" class="rounded-xl px-2 py-1 text-[11px] font-bold border ${cardCls}">
                          <option value="lent">+ Lent</option>
                          <option value="returned">- Return</option>
                        </select>
                        <input id="lentAmt_${p.id}" type="number" placeholder="₹ Amount" class="rounded-xl px-2 py-1 text-[11px] font-bold border ${cardCls}" />
                        <input id="lentDate_${p.id}" type="date" value="${new Date().toISOString().slice(0,10)}" class="rounded-xl px-1.5 py-1 text-[10px] border ${cardCls}" />
                      </div>
                      <div class="flex gap-1.5">
                        <input id="lentNote_${p.id}" type="text" placeholder="Note" class="flex-1 rounded-xl px-2.5 py-1 text-[11px] border ${cardCls}" />
                        <button onclick="addLentEntry('${p.id}')" class="px-3 py-1 rounded-xl text-[11px] font-bold btn-primary-uniform">Save</button>
                      </div>
                      <div class="divide-y divide-stone-200/30 text-[11px]">
                        ${(p.history||[]).map(h => `
                          <div class="py-1 flex justify-between">
                            <span>${h.note} (${h.date})</span>
                            <span class="font-bold ${h.type==='returned'?'text-rose-600':accentTxt}">${h.type==='returned'?'-':'+'}${formatINR(h.amount)}</span>
                          </div>
                        `).join('')}
                      </div>
                    </div>
                  ` : ''}
                </div>
              `).join('')}
            </div>
          </div>
        `;
      } else if (activeTab === 'roadmap') {
        mainHtml = `
          <div class="space-y-2">
            ${state.roadmap.map(r => `
              <div onclick="toggleRoadmap('${r.id}')" class="rounded-2xl p-3.5 border ${cardCls} cursor-pointer">
                <div class="flex justify-between items-center">
                  <span class="text-xs font-extrabold">${r.done ? '✅ ' : '⬜ '}${r.month}</span>
                  <span class="text-[10px] font-bold ${accentTxt}">Friend: ${formatINR(r.friendPay)} | BoB: ${formatINR(r.bobPay)}</span>
                </div>
                <p class="text-[11px] ${mutedTxt} mt-1">${r.note}</p>
              </div>
            `).join('')}
          </div>
        `;
      } else if (activeTab === 'sync') {
        mainHtml = `
          <div class="rounded-3xl p-4 border ${cardCls} space-y-3">
            <h3 class="text-xs font-extrabold">Cloud Backup &amp; Google Sheet Sync</h3>
            <p class="text-[11px] ${mutedTxt}">Your data is saved automatically on your iPhone in offline storage. You can also paste your Google Apps Script Web App URL below for 2-way Google Sheet backup:</p>
            <input type="text" value="${syncWebhookUrl}" onchange="localStorage.setItem('sachin_gsheet_webhook', this.value); syncWebhookUrl=this.value;" placeholder="https://script.google.com/macros/s/.../exec" class="w-full rounded-xl px-3 py-2 text-xs border ${subCardCls}" />
          </div>
        `;
      }

      document.getElementById('app').innerHTML = `
        <header class="sticky top-0 z-30 backdrop-blur-xl ${isDark?'bg-[#090D16]/95 border-slate-800':'bg-[#FBF9F5]/95 border-[#E2DDD2]'} border-b px-4 py-3">
          <div class="max-w-lg mx-auto flex items-center justify-between">
            <div class="flex items-center gap-2.5">
              <div class="w-9 h-9 rounded-2xl btn-primary-uniform flex items-center justify-center font-black text-base">₹</div>
              <div>
                <h1 class="text-sm font-extrabold">Sachin's Wealth Studio</h1>
                <p class="text-[10px] ${mutedTxt}">iPhone Full-Screen PWA • Nov 2026</p>
              </div>
            </div>
            <button onclick="state.uiTheme = (state.uiTheme==='light'?'dark':'light'); save();" class="px-3 py-1.5 rounded-xl text-xs font-bold btn-primary-uniform">
              ${isDark ? '☀️ Light' : '🌙 Dark'}
            </button>
          </div>
        </header>

        <main class="max-w-lg mx-auto px-4 pt-3 space-y-4">
          <div class="rounded-3xl p-3 border ${cardCls}">
            <div class="flex justify-between items-center mb-1.5">
              <span class="text-[11px] font-bold">Live Bank &amp; RuPay CC (Nov 2026)</span>
              ${state.rupayCcBalance > 0 ? `<button onclick="payRupay()" class="px-2 py-0.5 rounded-lg text-[10px] font-bold btn-primary-uniform">Pay CC (${formatINR(state.rupayCcBalance)})</button>` : ''}
            </div>
            <div class="grid grid-cols-3 text-center divide-x divide-stone-300/40 p-2 rounded-2xl border ${subCardCls}">
              <div><p class="text-[10px] ${mutedTxt}">Bank Now</p><p class="text-xs font-extrabold ${accentTxt}">${formatINR(state.liveBankBalance)}</p></div>
              <div><p class="text-[10px] ${mutedTxt}">RuPay CC</p><p class="text-xs font-extrabold text-rose-600">${formatINR(state.rupayCcBalance)}</p></div>
              <div><p class="text-[10px] ${mutedTxt}">Net Cash</p><p class="text-xs font-extrabold">${formatINR(state.liveBankBalance - state.rupayCcBalance)}</p></div>
            </div>
          </div>
          ${mainHtml}
        </main>

        <nav class="fixed bottom-0 left-0 right-0 z-40 backdrop-blur-xl ${isDark?'bg-[#090D16]/95 border-slate-800':'bg-[#FBF9F5]/95 border-[#E2DDD2]'} border-t px-2 py-1.5">
          <div class="max-w-lg mx-auto grid grid-cols-5 gap-1 text-center">
            <button onclick="activeTab='expenses';render();" class="py-1.5 rounded-2xl text-[10px] font-bold ${activeTab==='expenses'?'bg-indigo-100 text-indigo-900':mutedTxt}">💬<br/>Spends</button>
            <button onclick="activeTab='categories';render();" class="py-1.5 rounded-2xl text-[10px] font-bold ${activeTab==='categories'?'bg-indigo-100 text-indigo-900':mutedTxt}">🗂️<br/>Categories</button>
            <button onclick="activeTab='balancesheet';render();" class="py-1.5 rounded-2xl text-[10px] font-bold ${activeTab==='balancesheet'?'bg-indigo-100 text-indigo-900':mutedTxt}">🏛️<br/>Sheet</button>
            <button onclick="activeTab='roadmap';render();" class="py-1.5 rounded-2xl text-[10px] font-bold ${activeTab==='roadmap'?'bg-indigo-100 text-indigo-900':mutedTxt}">📅<br/>Debt Plan</button>
            <button onclick="activeTab='sync';render();" class="py-1.5 rounded-2xl text-[10px] font-bold ${activeTab==='sync'?'bg-indigo-100 text-indigo-900':mutedTxt}">☁️<br/>Sync</button>
          </div>
        </nav>
      `;
    }
    render();
  </script>
</body>
</html>
